<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRIN</title>
    <style>
    
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f6f8; 
        color: #333333;
        margin: 0;
        padding: 0;
    }

    
    form {
        background-color: #ffffff;
        max-width: 350px;
        
        margin-left: auto !important;
        margin-right: auto !important;
        padding: 40px 20px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05); /* Hafif modern gölge */
    }

    
    label {
        display: block;
        font-weight: 600;
        color: #2c3e50;
        text-align: left;
        width: 80%;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 5px;
        font-size: 14px;
    }

    
    input[type="text"],
    input[type="password"] {
        width: 80%;
        padding: 12px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
        transition: border-color 0.3s ease;
        background-color: #fafafa;
    }

    
    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #2c3e50;
        outline: none;
        background-color: #ffffff;
    }

    
    input[type="submit"] {
        background-color: #2c3e50;
        color: #ffffff;
        border: none;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        width: 80%;
        transition: background-color 0.2s ease, transform 0.1s ease;
    }

   
    input[type="submit"]:hover {
        background-color: #1a252f;
    }
    input[type="submit"]:active {
        transform: scale(0.98);
    }

   
    div > button {
        background-color: transparent;
        color: #2c3e50;
        border: 2px solid #2c3e50;
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

  
    div > button:hover {
        background-color: #2c3e50;
        color: #ffffff;
    }
</style>
</head>
<body>
           <h1 style="text-align: center; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', sans-serif; font-size: 4.5rem; font-weight: 900; color: #d97706; letter-spacing: 5px; text-shadow: 3px 3px 0px #fcd34d; margin-bottom: 20px; margin-top: 200px;">ABG</h1>
    <form style="text-align:  center;"  method="post">
        <label for="Name">Ad Soyad:</label>
        <input type="text" id="Name" name="Name"><br><br>
        <label for="Password">Şifre:</label>
        <input type="password" id="password" name="Password"><br><br>
        <input type="submit" id="giriş" value="Giriş Yap" name="Submit">
    </form>
<div style="display: none; justify-content: center; align-items: center; width: 100%; margin-top: 20px;" id="register_button">  <button type="button"  onclick="window.location.href='register.html'">Yeni Hesap Aç</button> </div> 
<script type="module">
const qualify=document.getElementById("giriş");
 import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import { getFirestore, collection,query, where, addDoc,getCountFromServer,getDocs,getDoc,doc} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  const firebaseConfig = {
  apiKey: "AIzaSyC4WNPVJmGtCEYODs-HRr31xylLvaGh_00",
  authDomain: "firin-de67b.firebaseapp.com",
  projectId: "firin-de67b",
  storageBucket: "firin-de67b.firebasestorage.app",
  messagingSenderId: "61410927896",
  appId: "1:61410927896:web:e7e1a4e6168822a360aa6d",
  measurementId: "G-R7HVRW9S6P"
};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);
    async function watch() {
     const reggi= await getDoc(doc(db,"sistem","Kayitlar"));
     if(reggi.exists())
     {
        const eleman=document.getElementById("register_button");
        //console.log("var");
        if(reggi.data().Regi==="False")
     {
    
        const eleman=document.getElementById("register_button");
        if (eleman) {
           // console.log("var bak burda eleman")
                eleman.remove();
            }
     }else if(reggi.data().Regi==="True")
     {
            eleman.style.display = "flex";
     }

     }
}
document.addEventListener("DOMContentLoaded", function() {
    watch();
    });

qualify.addEventListener("click", function(event) {
event.preventDefault();
async function kontrol() {
    const Name=document.getElementById("Name").value.trim();
const Password=document.getElementById("password").value.trim();
     if (Name === ""  || Password === ""){
  alert("geçersiz kayıt isteği");
  return;
  }

    const control=(query(collection(db,"kullanicilar"),where("isim","==",Name),where("sifre","==",Password)));
    const result=await getDocs(control);
if(result.empty)
{
    alert("kullanıcı adı veya şifre hatalı")
    return;
}else{
sessionStorage.setItem("aktifKullanici", Name);
alert("giriş başarılı ana sayfaya yönlendiriliyorsunuz");
window.location.href="main.html";
}}
kontrol();
});
</script>

</body>
</html>
